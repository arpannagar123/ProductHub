<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>ProductHub - Your Cart</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .object-cover {
            object-fit: cover;
        }
        .h-24 {
            height: 6rem;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .cart-item-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .cart-item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="bg-blue-50 shadow-lg p-4 flex flex-col sm:flex-row items-center justify-between border-b-4 border-b-blue-500">
        <div class="flex items-center mb-4 sm:mb-0">
            <img src="Product hub.png" alt="Product Hub Logo" class="h-10 w-10 rounded-full mr-3">
            <span class="text-blue-500 text-xl md:text-2xl font-bold">Product Hub</span>
        </div>
        <ul class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-6">
            <li><a href="./landing.html" class="text-blue-500 font-semibold hover:bg-blue-700 hover:text-white p-2 sm:p-3 rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">Home</a></li>
            <li><a href="./about.html" class="text-blue-500 font-semibold hover:bg-blue-700 p-2 sm:p-3 hover:text-white rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">About</a></li>
            <li><a href="./index.html" class="text-blue-500 font-semibold hover:bg-blue-700 p-2 sm:p-3 hover:text-white rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">Products</a></li>
            <li><a href="./cart.html" class="text-blue-700 font-semibold bg-blue-100 p-2 sm:p-3 rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">Cart</a></li>
        </ul>
    </nav>

    <main class="container mx-auto p-4 sm:p-8 md:p-12 flex-grow">
        <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-8 text-center">Your Shopping Cart</h1>
        
        <div id="cart-items-container" class="space-y-6">
        </div>

        <div id="cart-summary" class="bg-white rounded-xl shadow-lg p-6 mt-8 md:p-8">
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-4">Order Summary</h2>
            <div class="flex justify-between items-center text-lg sm:text-xl font-semibold text-gray-700 mb-4">
                <span>Subtotal:</span>
                <span id="cart-subtotal">$0.00</span>
            </div>
            <div class="flex justify-between items-center text-lg sm:text-xl font-semibold text-gray-700 mb-6">
                <span>Shipping:</span>
                <span>Calculated at checkout</span>
            </div>
            <div class="flex justify-between items-center text-2xl sm:text-3xl font-extrabold text-blue-600 border-t-2 border-blue-200 pt-4">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <a href="./checkout.html" class="block bg-green-600 text-white font-bold py-3 px-8 rounded-lg w-full mt-8 text-center cursor-pointer
                           hover:bg-green-700 transition duration-200 shadow-md text-lg">Proceed to Checkout</a>
            <button id="clear-cart-btn" class="bg-red-500 text-white font-bold py-3 px-8 rounded-lg w-full mt-4 cursor-pointer
                           hover:bg-red-600 transition duration-200 shadow-md text-lg">Clear Cart</button>
        </div>

        <div id="empty-cart-message" class="hidden text-center text-gray-600 text-xl py-16">
            Your cart is empty. <a href="./index.html" class="text-blue-500 hover:underline">Start shopping now!</a>
        </div>
    </main>

    <footer class="bg-blue-500 text-white p-6 text-center mt-auto">
        <div class="container mx-auto">
            <p class="text-base sm:text-lg mb-2">&copy; 2025 Product Hub. All rights reserved.</p>
            <ul class="flex flex-col sm:flex-row justify-center space-y-1 sm:space-y-0 sm:space-x-6 text-sm">
            </ul>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartItemsContainer = document.getElementById('cart-items-container');
            const cartSubtotalElement = document.getElementById('cart-subtotal');
            const cartTotalElement = document.getElementById('cart-total');
            const emptyCartMessage = document.getElementById('empty-cart-message');
            const clearCartButton = document.getElementById('clear-cart-btn');

            function getCart() {
                return JSON.parse(localStorage.getItem('cart')) || [];
            }

            function saveCart(cart) {
                localStorage.setItem('cart', JSON.stringify(cart));
            }

            function renderCart() {
                const cart = getCart();
                cartItemsContainer.innerHTML = '';
                let subtotal = 0;

                if (cart.length === 0) {
                    emptyCartMessage.classList.remove('hidden');
                    document.getElementById('cart-summary').classList.add('hidden');
                    return;
                } else {
                    emptyCartMessage.classList.add('hidden');
                    document.getElementById('cart-summary').classList.remove('hidden');
                }

                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;

                    const itemCard = document.createElement('div');
                    itemCard.className = 'cart-item-card bg-white rounded-xl shadow-md p-4 flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4';
                    itemCard.innerHTML = `
                        <img src="${item.image}" alt="${item.name}" class="h-24 w-24 object-cover rounded-lg border border-gray-200 flex-shrink-0">
                        <div class="flex-grow text-center sm:text-left">
                            <p class="text-lg sm:text-xl font-semibold text-gray-800">${item.name}</p>
                            <p class="text-md text-gray-600">Price: $${item.price.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button class="quantity-btn bg-blue-200 text-blue-800 font-bold py-1 px-3 rounded-md hover:bg-blue-300 transition" data-id="${item.id}" data-action="decrease">-</button>
                            <span class="text-lg font-medium">${item.quantity}</span>
                            <button class="quantity-btn bg-blue-200 text-blue-800 font-bold py-1 px-3 rounded-md hover:bg-blue-300 transition" data-id="${item.id}" data-action="increase">+</button>
                        </div>
                        <p class="text-lg sm:text-xl font-bold text-blue-600 w-24 text-right">$${itemTotal.toFixed(2)}</p>
                        <button class="remove-item-btn bg-red-500 text-white font-bold py-1 px-3 rounded-md hover:bg-red-600 transition" data-id="${item.id}">Remove</button>
                    `;
                    cartItemsContainer.appendChild(itemCard);
                });

                cartSubtotalElement.textContent = `$${subtotal.toFixed(2)}`;
                cartTotalElement.textContent = `$${subtotal.toFixed(2)}`;
                attachEventListeners();
            }

            function attachEventListeners() {
                document.querySelectorAll('.quantity-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.target.dataset.id;
                        const action = event.target.dataset.action;
                        updateQuantity(id, action);
                    });
                });

                document.querySelectorAll('.remove-item-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const id = event.target.dataset.id;
                        removeItem(id);
                    });
                });
            }

            function updateQuantity(id, action) {
                let cart = getCart();
                const itemIndex = cart.findIndex(item => item.id === id);

                if (itemIndex > -1) {
                    if (action === 'increase') {
                        cart[itemIndex].quantity += 1;
                    } else if (action === 'decrease') {
                        if (cart[itemIndex].quantity > 1) {
                            cart[itemIndex].quantity -= 1;
                        } else {
                            cart.splice(itemIndex, 1);
                        }
                    }
                    saveCart(cart);
                    renderCart();
                }
            }

            function removeItem(id) {
                let cart = getCart();
                cart = cart.filter(item => item.id !== id);
                saveCart(cart);
                renderCart();
            }

            clearCartButton.addEventListener('click', () => {
                localStorage.removeItem('cart');
                renderCart();
            });

            renderCart();
        });
    </script>
</body>
</html>
