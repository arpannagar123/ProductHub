<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>ProductHub - Checkout</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .object-cover {
            object-fit: cover;
        }
        .h-16 {
            height: 4rem;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .form-input {
            @apply w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="bg-blue-50 shadow-lg p-4 flex flex-col sm:flex-row items-center justify-between border-b-4 border-b-blue-500">
        <div class="flex items-center mb-4 sm:mb-0">
            <img src="Product hub.png" alt="Product Hub Logo" class="h-10 w-10 rounded-full mr-3">
            <span class="text-blue-500 text-xl md:text-2xl font-bold">Product Hub</span>
        </div>
        <ul class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-6">
            <li><a href="./landing.html" class="text-blue-500 font-semibold hover:bg-blue-700 hover:text-white p-2 sm:p-3 rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">Home</a></li>
            <li><a href="./about.html" class="text-blue-500 font-semibold hover:bg-blue-700 p-2 sm:p-3 hover:text-white rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">About</a></li>
            <li><a href="./index.html" class="text-blue-500 font-semibold hover:bg-blue-700 p-2 sm:p-3 hover:text-white rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">Products</a></li>
            <li><a href="./cart.html" class="text-blue-500 font-semibold hover:bg-blue-700 p-2 sm:p-3 hover:text-white rounded-lg transition duration-300 ease-in-out text-base sm:text-lg">Cart</a></li>
        </ul>
    </nav>

    <main class="container mx-auto p-4 sm:p-8 md:p-12 flex-grow">
        <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-8 text-center">Checkout</h1>
        
        <div class="flex flex-col lg:flex-row gap-8">
            <section class="lg:w-2/3 bg-white rounded-xl shadow-lg p-6 md:p-8">
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-6">Shipping Information</h2>
                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label for="fullName" class="block text-gray-700 text-sm font-semibold mb-2">Full Name</label>
                        <input type="text" id="fullName" class="form-input" placeholder="John Doe" required>
                    </div>
                    <div>
                        <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="john.doe@example.com" required>
                    </div>
                    <div>
                        <label for="address" class="block text-gray-700 text-sm font-semibold mb-2">Address</label>
                        <input type="text" id="address" class="form-input" placeholder="123 Main St" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="city" class="block text-gray-700 text-sm font-semibold mb-2">City</label>
                            <input type="text" id="city" class="form-input" placeholder="Anytown" required>
                        </div>
                        <div>
                            <label for="state" class="block text-gray-700 text-sm font-semibold mb-2">State/Province</label>
                            <input type="text" id="state" class="form-input" placeholder="CA" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="zip" class="block text-gray-700 text-sm font-semibold mb-2">Zip Code</label>
                            <input type="text" id="zip" class="form-input" placeholder="12345" required>
                        </div>
                        <div>
                            <label for="country" class="block text-gray-700 text-sm font-semibold mb-2">Country</label>
                            <input type="text" id="country" class="form-input" placeholder="USA" required>
                        </div>
                    </div>
                </form>
            </section>

            <section class="lg:w-1/3 bg-white rounded-xl shadow-lg p-6 md:p-8">
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-6">Your Order</h2>
                <div id="checkout-items-container" class="space-y-4 mb-6 border-b pb-4">
                </div>
                <div class="flex justify-between items-center text-lg sm:text-xl font-semibold text-gray-700 mb-3">
                    <span>Subtotal:</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>
                <div class="flex justify-between items-center text-lg sm:text-xl font-semibold text-gray-700 mb-3">
                    <span>Shipping:</span>
                    <span>$5.00</span>
                </div>
                <div class="flex justify-between items-center text-2xl sm:text-3xl font-extrabold text-blue-600 border-t-2 border-blue-200 pt-4">
                    <span>Total:</span>
                    <span id="checkout-total">$0.00</span>
                </div>
                <button type="submit" form="checkout-form" class="bg-green-600 text-white font-bold py-3 px-8 rounded-lg w-full mt-8 cursor-pointer
                               hover:bg-green-700 transition duration-200 shadow-md text-lg">Place Order</button>
            </section>
        </div>

        <div id="empty-checkout-message" class="hidden text-center text-gray-600 text-xl py-16">
            Your cart is empty. <a href="./index.html" class="text-blue-500 hover:underline">Start shopping now!</a>
        </div>
    </main>

    <footer class="bg-blue-500 text-white p-6 text-center mt-auto">
        <div class="container mx-auto">
            <p class="text-base sm:text-lg mb-2">&copy; 2025 Product Hub. All rights reserved.</p>
            <ul class="flex flex-col sm:flex-row justify-center space-y-1 sm:space-y-0 sm:space-x-6 text-sm">
            </ul>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkoutItemsContainer = document.getElementById('checkout-items-container');
            const checkoutSubtotalElement = document.getElementById('checkout-subtotal');
            const checkoutTotalElement = document.getElementById('checkout-total');
            const emptyCheckoutMessage = document.getElementById('empty-checkout-message');
            const checkoutForm = document.getElementById('checkout-form');
            const shippingCost = 5.00;

            function getCart() {
                return JSON.parse(localStorage.getItem('cart')) || [];
            }

            function renderCheckout() {
                const cart = getCart();
                checkoutItemsContainer.innerHTML = '';
                let subtotal = 0;

                if (cart.length === 0) {
                    emptyCheckoutMessage.classList.remove('hidden');
                    document.querySelector('main > div.flex').classList.add('hidden');
                    return;
                } else {
                    emptyCheckoutMessage.classList.add('hidden');
                    document.querySelector('main > div.flex').classList.remove('hidden');
                }

                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'flex items-center justify-between';
                    itemDiv.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <img src="${item.image}" alt="${item.name}" class="h-16 w-16 object-cover rounded-lg flex-shrink-0">
                            <div>
                                <p class="text-md font-medium text-gray-800">${item.name}</p>
                                <p class="text-sm text-gray-600">Qty: ${item.quantity} x $${item.price.toFixed(2)}</p>
                            </div>
                        </div>
                        <span class="text-md font-semibold text-gray-800">$${itemTotal.toFixed(2)}</span>
                    `;
                    checkoutItemsContainer.appendChild(itemDiv);
                });

                checkoutSubtotalElement.textContent = `$${subtotal.toFixed(2)}`;
                const total = subtotal + shippingCost;
                checkoutTotalElement.textContent = `$${total.toFixed(2)}`;
            }

            checkoutForm.addEventListener('submit', (event) => {
                event.preventDefault();

                const formData = {
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    address: document.getElementById('address').value,
                    city: document.getElementById('city').value,
                    state: document.getElementById('state').value,
                    zip: document.getElementById('zip').value,
                    country: document.getElementById('country').value,
                    items: getCart(),
                    total: parseFloat(checkoutTotalElement.textContent.replace('$', ''))
                };

                console.log('Order placed:', formData);
                alert('Your order has been placed successfully!');
                
                localStorage.removeItem('cart');
                window.location.href = './landing.html';
            });

            renderCheckout();
        });
    </script>
</body>
</html>
